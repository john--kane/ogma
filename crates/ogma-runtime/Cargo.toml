[package]
name = "ogma-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ogma_runtime"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ogma-worker"
path = "src/main.rs"

[dependencies]
deno_ast = { version = "=0.49.0", features = ["transpiling"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.49.0", features = ["rt", "rt-multi-thread", "fs", "io-util", "time", "net", "process", "macros"] }
sha2 = "=0.10.9"
libc = "=0.2.182"

rust_jsc = "=0.5.0"
rust_jsc_sys = "=0.4.2"
url = "=2.5.8"
sourcemap = "=9.3.2"

reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
semver = "=1.0.28"
base64 = "=0.22.1"
axum = { version = "=0.8.4", default-features = false, features = ["http1", "tokio", "json"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

jsonschema = { version = "=0.58.6", default-features = false }
