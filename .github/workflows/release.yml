name: Package preview (no publishing)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: Require the caller-supplied OGMA_ED25519_PRIVATE_KEY secret
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.112'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap clang zlib1g-dev
      - if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: python3 tools/build.py --core-only
      - run: python3 tools/generate_contracts.py --check
      - run: |
          RUST_JSC_CUSTOM_BUILD_PATH="$(python3 tools/prepare_jsc.py | tail -1)" cargo test --locked -p ogma-runtime -- --skip model:: --skip model_store:: --skip model_context::
      - run: python3 tools/test_core.py
      - name: Require combined Linux namespace/seccomp execution
        if: runner.os == 'Linux'
        env:
          OGMA_REQUIRE_SANDBOX: '1'
        run: python3 -m unittest discover -s tests -p test_sandbox.py -v
      - run: python3 tools/benchmark.py --samples=100 --output=artifacts/startup.json
      - name: Package and optionally sign with external identity
        id: package
        env:
          OGMA_SIGNING_KEY_PEM: ${{ secrets.OGMA_ED25519_PRIVATE_KEY }}
          OGMA_TRUSTED_PUBLIC_KEY_PEM: ${{ vars.OGMA_ED25519_PUBLIC_KEY }}
          REQUIRE_SIGNATURE: ${{ (inputs.sign || startsWith(github.ref, 'refs/tags/')) && 'true' || 'false' }}
          RELEASE_NAME: ogma-${{ matrix.os }}-preview
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          key = os.environ.get('OGMA_SIGNING_KEY_PEM', '')
          if os.environ['REQUIRE_SIGNATURE'] == 'true' and not key:
              raise SystemExit('Signing requested but OGMA_ED25519_PRIVATE_KEY secret is missing')
          trusted = os.environ.get('OGMA_TRUSTED_PUBLIC_KEY_PEM', '')
          if key and not trusted:
              raise SystemExit('Signing requires independent OGMA_ED25519_PUBLIC_KEY repository variable')
          name = os.environ['RELEASE_NAME']
          command = ['python3', 'tools/release.py', '--name', name]
          with tempfile.TemporaryDirectory() as folder:
              private = Path(folder) / 'private.pem'
              public = Path(folder) / 'public.pem'
              if key:
                  private.write_text(key)
                  private.chmod(0o600)
                  public.write_text(trusted)
                  command += ['--sign-key', str(private)]
              subprocess.run(command, check=True)
              trust = ['--public-key', str(public)] if key else ['--allow-unsigned']
              subprocess.run(['python3', 'tools/verify_preview.py', f'dist/{name}.manifest.json',
                              '--output', 'dist/installed-core-preview.json', *trust], check=True)
              if key:
                  (Path('dist') / 'release-public.pem').write_text(trusted)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write('signature=' + ('signed' if key else 'unsigned') + '\n')
          PY
      - run: cp artifacts/startup.json dist/startup.json
      - uses: actions/upload-artifact@v4
        with:
          name: ogma-${{ matrix.os }}-${{ steps.package.outputs.signature }}
          path: dist/
